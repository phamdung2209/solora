<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<link rel="stylesheet" href="/scene/kit/kit.css">
{{head}}
</head>
<body class="k-admin-body">
<div id="stage">
  <div class="k-admin">
    <header class="k-top">
      <span class="k-top-logo"><svg viewBox="0 0 18 18"><path d="M4.2 5.6h9.6l.9 9.1a1.2 1.2 0 0 1-1.2 1.3H4.5a1.2 1.2 0 0 1-1.2-1.3Z" fill="#fff"/><path d="M6.4 6.8V5a2.6 2.6 0 0 1 5.2 0v1.8" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>Admin</span>
      <span class="k-top-search"><svg viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m9.2 9.2 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Search<kbd>Ctrl K</kbd></span>
      <span class="k-top-store">Demo Store<i>DS</i></span>
    </header>
    <nav class="k-rail">
      <span><svg viewBox="0 0 16 16"><path d="M2.5 7 8 2.5 13.5 7v6a.8.8 0 0 1-.8.8H9.8V10H6.2v3.8H3.3a.8.8 0 0 1-.8-.8Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
      <span><svg viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 7h11" stroke="currentColor" stroke-width="1.4"/></svg></span>
      <span><svg viewBox="0 0 16 16"><path d="M8.6 2.5H13a.5.5 0 0 1 .5.5v4.4L7.6 13.3a1 1 0 0 1-1.4 0L2.7 9.8a1 1 0 0 1 0-1.4Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10.6" cy="5.4" r="1.1" fill="currentColor"/></svg></span>
      <span><svg viewBox="0 0 16 16"><circle cx="8" cy="5.6" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 13.5c.6-2.6 2.6-4 5-4s4.4 1.4 5 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
      <span class="is-on"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M11.25 9v4.5M9 11.25h4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
    </nav>
    <section class="k-main">
      <div class="k-apphead"><img src="{{icon}}" alt="">{{appName}}<span class="k-grow"></span><svg class="k-apphead-dots" viewBox="0 0 16 16" width="16" height="16"><circle cx="4" cy="8" r="1.2" fill="currentColor"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="12" cy="8" r="1.2" fill="currentColor"/></svg></div>
      <div class="k-scroll" data-scroll>
        <div class="k-page" data-page>
          {{body}}
        </div>
      </div>
    </section>
  </div>
  {{overlays}}
</div>
<script src="/scene/kit/kit.js"></script>
{{scripts}}
</body>
</html>
